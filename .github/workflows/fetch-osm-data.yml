name: Fetch OSM building data

# Fetches real building footprints/heights around Cyberport from OpenStreetMap
# (Overpass API) and commits the compact extract the keyless "Open 3D" source
# renders. Run manually from the Actions tab whenever the data should refresh.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Query OpenStreetMap
        run: |
          set -euo pipefail
          QUERY='[out:json][timeout:120];(way["building"](22.248,114.115,22.274,114.145);relation["building"](22.248,114.115,22.274,114.145););out geom qt;'
          for round in 1 2 3; do
            for endpoint in \
              "https://overpass-api.de/api/interpreter" \
              "https://overpass.kumi.systems/api/interpreter" \
              "https://overpass.osm.jp/api/interpreter" \
              "https://overpass.private.coffee/api/interpreter" \
              "https://maps.mail.ru/osm/tools/overpass/api/interpreter"; do
              echo "Round $round: trying $endpoint"
              if curl -sS --fail --max-time 180 -d "data=$QUERY" "$endpoint" -o osm-raw.json \
                 && [ "$(wc -c < osm-raw.json)" -gt 10000 ]; then
                echo "OK: $(wc -c < osm-raw.json) bytes from $endpoint"
                exit 0
              fi
              sleep 5
            done
            sleep 20
          done
          # Last resort: the main OSM API map call (reliable; small bbox is
          # well within its limits). Raw format — the build script resolves
          # way->node references itself.
          echo "Overpass unavailable — falling back to api.openstreetmap.org"
          curl -sS --fail --max-time 300 \
            "https://api.openstreetmap.org/api/0.6/map.json?bbox=114.115,22.248,114.145,22.274" \
            -o osm-raw.json
          [ "$(wc -c < osm-raw.json)" -gt 10000 ]
          echo "OK: $(wc -c < osm-raw.json) bytes from api.openstreetmap.org"

      - name: Build compact extract
        run: node scripts/build-osm-data.mjs osm-raw.json

      - name: Fetch HK Gov aerial imagery tiles
        run: node scripts/fetch-imagery.mjs

      # Best effort: real per-building heights (and mapped colours) from
      # Overture Maps' public parquet. If the query fails or the release
      # layout moves, enrichment simply falls back to OSM heights.
      - name: Fetch Overture building heights
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          curl -sSL --max-time 180 -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -o -q duckdb.zip
          chmod +x ./duckdb
          REL=$(./duckdb -noheader -list -c \
            "INSTALL httpfs; LOAD httpfs; SET s3_region='us-west-2';
             SELECT file FROM glob('s3://overturemaps-us-west-2/release/*')
             ORDER BY file DESC LIMIT 1;")
          echo "Overture release: $REL"
          [ -n "$REL" ]
          ./duckdb -c "
            INSTALL httpfs; LOAD httpfs; SET s3_region='us-west-2';
            COPY (
              SELECT
                (bbox.xmin + bbox.xmax) / 2 AS lon,
                (bbox.ymin + bbox.ymax) / 2 AS lat,
                height, num_floors, roof_color, facade_color, roof_shape
              FROM read_parquet('${REL}/theme=buildings/type=building/*', hive_partitioning=1)
              WHERE bbox.xmin BETWEEN 114.110 AND 114.150
                AND bbox.ymin BETWEEN 22.243 AND 22.279
            ) TO 'overture-buildings.json' (FORMAT JSON);"
          wc -l overture-buildings.json

      - name: Measure real building colours from the orthophoto
        run: |
          npm install pngjs@7 --no-save --no-audit --no-fund
          node scripts/enrich-buildings.mjs overture-buildings.json

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update OSM buildings + HK aerial imagery for Open 3D source"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
