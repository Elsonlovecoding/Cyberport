name: Fetch OSM building data

# Fetches real building footprints/heights around Cyberport from OpenStreetMap
# (Overpass API) and commits the compact extract the keyless "Open 3D" source
# renders. Run manually from the Actions tab whenever the data should refresh.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Query Overpass API
        run: |
          set -euo pipefail
          QUERY='[out:json][timeout:120];(way["building"](22.248,114.115,22.274,114.145);relation["building"](22.248,114.115,22.274,114.145););out geom qt;'
          for endpoint in \
            "https://overpass-api.de/api/interpreter" \
            "https://overpass.kumi.systems/api/interpreter"; do
            echo "Trying $endpoint"
            if curl -sS --fail --max-time 180 -d "data=$QUERY" "$endpoint" -o osm-raw.json \
               && [ "$(wc -c < osm-raw.json)" -gt 10000 ]; then
              echo "OK: $(wc -c < osm-raw.json) bytes"
              exit 0
            fi
            sleep 5
          done
          echo "All Overpass endpoints failed" >&2
          exit 1

      - name: Build compact extract
        run: node scripts/build-osm-data.mjs osm-raw.json

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cyberport-buildings.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update OSM building extract for Open 3D source"
          git push
