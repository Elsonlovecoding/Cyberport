<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cyberport 3D — Hong Kong</title>
  <meta name="description" content="Photorealistic 3D map viewer of Cyberport, Pok Fu Lam, Hong Kong. Real captured geometry streamed as 3D Tiles (Google / Lands Department HKSAR)." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127961;</text></svg>" />
  <!-- CesiumJS 1.144 — pinned, official Cesium CDN -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- UI overlay. The container ignores pointer events; only controls receive them,
       so the map stays draggable everywhere and Cesium's credit/attribution area
       (bottom-left) is never covered. -->
  <div id="ui">
    <button id="menuToggle" type="button" aria-label="Toggle controls" aria-expanded="false">&#9776;</button>

    <div id="panel">
      <div class="row">
        <span class="label">Source</span>
        <div class="seg" id="sourceSeg">
          <button id="srcGoogle" type="button">Google</button>
          <button id="srcHk" type="button">HK Gov</button>
          <button id="srcOsm" type="button" title="Real OpenStreetMap building geometry — no key needed">Open 3D</button>
        </div>
      </div>
      <div class="row">
        <span class="label">Quality</span>
        <div class="seg" id="qualitySeg">
          <button type="button" data-sse="8">Ultra</button>
          <button type="button" data-sse="16">High</button>
          <button type="button" data-sse="32">Fast</button>
        </div>
      </div>
      <div class="row">
        <button id="streetBtn" type="button" title="Open Google Street View at the point you are looking at">Street level &#8599;</button>
      </div>
      <div id="status" role="status" hidden></div>
      <div id="hint">Drag&nbsp;pan &middot; Right-drag&nbsp;rotate/tilt &middot; Wheel&nbsp;or&nbsp;+/&minus;&nbsp;zoom &middot; Double-click&nbsp;dive &middot; WASD+QE&nbsp;fly (Shift&nbsp;fast) &middot; B&nbsp;bookmark &middot; O&nbsp;orbit &middot; F&nbsp;fps</div>
    </div>

    <div id="fps" hidden></div>
    <div id="spinner" hidden aria-label="Loading tiles"></div>
    <div id="toast" hidden></div>

    <!-- On-screen camera controls: hold a button to keep moving -->
    <div id="navPad" aria-label="Camera controls">
      <button id="compassBtn" type="button" title="Compass — click to face north">
        <svg id="compassNeedle" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <polygon points="12,1.5 15.5,12 12,10 8.5,12" fill="#ff6b57"></polygon>
          <polygon points="12,22.5 8.5,12 12,14 15.5,12" fill="#e8eaed"></polygon>
        </svg>
      </button>
      <div class="pad-grid">
        <button data-nav="rotl" type="button" title="Rotate left (hold)">&#8634;</button>
        <button data-nav="fwd" type="button" title="Move forward (hold)">&#9650;</button>
        <button data-nav="rotr" type="button" title="Rotate right (hold)">&#8635;</button>
        <button data-nav="left" type="button" title="Move left (hold)">&#9664;</button>
        <button data-nav="back" type="button" title="Move back (hold)">&#9660;</button>
        <button data-nav="right" type="button" title="Move right (hold)">&#9654;</button>
      </div>
      <div class="pad-row">
        <button data-nav="tiltup" type="button" title="Tilt toward horizon (hold)">&#8896;</button>
        <button data-nav="tiltdown" type="button" title="Tilt toward ground (hold)">&#8897;</button>
      </div>
      <div class="pad-row">
        <button data-nav="zoomin" type="button" class="zoom" title="Zoom in (hold)">+</button>
        <button data-nav="zoomout" type="button" class="zoom" title="Zoom out (hold)">&minus;</button>
      </div>
    </div>

    <div id="bookmarkBar" aria-label="Viewpoints"></div>

    <!-- Required attribution (in addition to Cesium's credit container below-left) -->
    <div id="credit">3D data: Google / Lands Department, HKSAR Govt (CSDI) / &copy; OpenStreetMap contributors</div>

    <div id="fatal" hidden></div>
  </div>

  <noscript>
    <div class="noscript">Cyberport 3D needs JavaScript enabled.</div>
  </noscript>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>
  <script src="app.js"></script>
</body>
</html>
